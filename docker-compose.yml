version: '3.8'

# Dados persistentes (banco e uploads) ficam numa pasta do host, não em volumes
# do Docker: `docker compose down -v` apaga volumes, mas não pastas montadas.
# Na VPS, SMARTHIVE_DADOS=/root/smarthive-dados (no .env). Backup diário:
# scripts/backup_smarthive.sh.

services:
  # Banco de dados
  postgres:
    image: postgres:16-alpine
    container_name: smarthive-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=smarthive
      - POSTGRES_USER=smarthive
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - ${SMARTHIVE_DADOS:-./dados}/postgres:/var/lib/postgresql/data
    networks:
      - smarthive-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthive -d smarthive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthive-backend
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - ${SMARTHIVE_DADOS:-./dados}/media:/app/media
      - ./IA-smart_hive/models:/app/ia_models:ro
    environment:
      - DJANGO_SETTINGS_MODULE=smarthive.settings
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - IA_MODELS_DIR=/app/ia_models
      - MEDIAMTX_AUTH_SECRET=${MEDIAMTX_AUTH_SECRET:-}
      - CAMERA_SESSAO_MAX_MINUTOS=${CAMERA_SESSAO_MAX_MINUTOS:-30}
      - POSTGRES_DB=smarthive
      - POSTGRES_USER=smarthive
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_HOST=postgres
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smarthive-network
      - smarthive-integration
    healthcheck:
      # A imagem não tem curl; /admin/login/ responde 200 sem precisar de login
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuild
    container_name: smarthive-frontend
    restart: unless-stopped
    networks:
      - smarthive-network
    healthcheck:
      # 127.0.0.1: "localhost" resolve para IPv6, onde o nginx do container não escuta
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor de mídia da câmera ao vivo (Raspberry Pi publica via RTSP,
  # navegador assiste via HLS em /hls/ pelo nginx)
  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    container_name: smarthive-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_AUTHHTTPADDRESS=http://backend:8000/api/camera/mediamtx-auth/?segredo=${MEDIAMTX_AUTH_SECRET:-}
    depends_on:
      - backend
    networks:
      - smarthive-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smarthive-nginx
    restart: unless-stopped
    ports:
      - "${SMARTHIVE_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/static:ro
      - ${SMARTHIVE_DADOS:-./dados}/media:/media:ro
    depends_on:
      - backend
      - frontend
      - mediamtx
    networks:
      - smarthive-network

volumes:
  # Só arquivos regeneráveis (collectstatic); dados de verdade ficam em SMARTHIVE_DADOS
  static_volume:

networks:
  smarthive-network:
    driver: bridge
  # Rede compartilhada com o docker-compose do pipeline de visao computacional
  # (repo separado, C:\Users\Gabriel\Desktop\abelhas\hive), so pra o worker
  # de la conseguir chamar esse backend. Precisa existir antes:
  # docker network create smarthive-integration
  smarthive-integration:
    external: true
