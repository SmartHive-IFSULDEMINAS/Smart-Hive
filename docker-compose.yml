version: '3.8'

services:
  # Backend Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthive-backend
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./IA-smart_hive/models:/app/ia_models:ro
    environment:
      - DJANGO_SETTINGS_MODULE=smarthive.settings
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-this-to-a-random-secret-key-in-production
      - IA_MODELS_DIR=/app/ia_models
      - MEDIAMTX_AUTH_SECRET=${MEDIAMTX_AUTH_SECRET:-}
      - CAMERA_SESSAO_MAX_MINUTOS=${CAMERA_SESSAO_MAX_MINUTOS:-30}
    networks:
      - smarthive-network
      - smarthive-integration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/dashboard/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuild
    container_name: smarthive-frontend
    restart: unless-stopped
    networks:
      - smarthive-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor de mídia da câmera ao vivo (Raspberry Pi publica via RTSP,
  # navegador assiste via HLS em /hls/ pelo nginx)
  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    container_name: smarthive-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      - MTX_AUTHHTTPADDRESS=http://backend:8000/api/camera/mediamtx-auth/?segredo=${MEDIAMTX_AUTH_SECRET:-}
    depends_on:
      - backend
    networks:
      - smarthive-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smarthive-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - backend
      - frontend
      - mediamtx
    networks:
      - smarthive-network

volumes:
  sqlite_data:
  static_volume:
  media_volume:

networks:
  smarthive-network:
    driver: bridge
  # Rede compartilhada com o docker-compose do pipeline de visao computacional
  # (repo separado, C:\Users\Gabriel\Desktop\abelhas\hive), so pra o worker
  # de la conseguir chamar esse backend. Precisa existir antes:
  # docker network create smarthive-integration
  smarthive-integration:
    external: true
