# MediaMTX — câmera ao vivo do Raspberry Pi.
# O Pi publica via RTSP/TCP (:8554, exposta) e o navegador assiste via
# LL-HLS (:8888, só interna, acessada por /camera/ no nginx).
# Quem pode publicar/assistir é decidido pelo Django; o endereço do webhook
# (com o segredo) vem da env MTX_AUTHHTTPADDRESS no docker-compose.

logLevel: info

authMethod: http
authHTTPAddress: http://backend:8000/api/camera/mediamtx-auth/

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

rtmp: no
webrtc: no
srt: no

paths:
  all_others:
