upstream backend {
    server backend:8000;
}

upstream mediamtx {
    server mediamtx:8888;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Webhook de autenticação do MediaMTX: só o próprio MediaMTX (rede interna
    # do Docker, direto no backend) pode chamar; de fora não existe
    location = /api/camera/mediamtx-auth/ {
        return 404;
    }

    # API Backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Câmera ao vivo (HLS servido pelo MediaMTX; autenticação feita pelo
    # MediaMTX via webhook no Django, com o JWT do header Authorization)
    location /hls/ {
        proxy_pass http://mediamtx/;
        proxy_set_header Host $host;
        # Várias requisições por segundo por espectador, e o player nativo do
        # Safari leva o JWT na URL (?jwt=): não vai para o access log
        access_log off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Django Admin
    location /admin/ {
        # Upload do vídeo de exemplo da câmera (até 100 MB, validado no Django)
        client_max_body_size 110M;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files do Django
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend React
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
