# Config do nginx usada na VPS de produção (portas 80/443 da máquina,
# compartilhadas com outros sites — por isso os upstreams têm prefixo
# smarthive_). Para aplicar na VPS:
#   cp nginx/producao/smarthive.conf nginx/conf.d/smarthive.conf
#   docker exec smarthive-nginx nginx -t && docker exec smarthive-nginx nginx -s reload

upstream smarthive_backend {
    server backend:8000;
}
upstream smarthive_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name 191.252.100.161;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Webhook de autenticação do MediaMTX: só o MediaMTX (rede interna) chama
    location = /api/camera/mediamtx-auth/ {
        return 404;
    }

    # API Backend
    location /api/ {
        proxy_pass http://smarthive_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Câmera ao vivo (HLS do MediaMTX). Resolvido em tempo de requisição pelo
    # DNS interno do Docker: se o MediaMTX estiver fora do ar, só esta rota
    # falha — o nginx (que atende outros sites) sobe normalmente.
    location /hls/ {
        resolver 127.0.0.11 valid=30s;
        set $smarthive_mediamtx mediamtx:8888;
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass http://$smarthive_mediamtx;
        proxy_set_header Host $host;
        # Várias requisições por segundo por espectador, e o player nativo do
        # Safari leva o JWT na URL (?jwt=): não vai para o access log
        access_log off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Django Admin
    location /admin/ {
        # Upload do vídeo de exemplo da câmera (até 100 MB, validado no Django)
        client_max_body_size 110M;
        proxy_pass http://smarthive_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files do Django
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Frontend React
    location / {
        proxy_pass http://smarthive_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
